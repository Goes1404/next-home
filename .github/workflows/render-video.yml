# O worker de render de vídeo.
#
# Roda aqui, e não na Vercel, por medição: 174 s para um vídeo de 17 s em 4
# CPUs, contra o teto de 60 s por função do plano Hobby. A rota do painel
# enfileira; este workflow esvazia a fila.
#
# ## Dois gatilhos, e os papéis são diferentes
#
# `workflow_dispatch` é o CAMINHO PRINCIPAL: o painel aciona por API assim que
# o vídeo entra na fila (`src/lib/video/acionarRender.ts`), e o render começa
# em segundos.
#
# `schedule` é REDE DE SEGURANÇA, não o caminho principal — por isso de hora
# em hora, e não a cada 15 min. Ele existe porque o acionamento direto tem um
# ponto único de falha: token expirado, GitHub fora, env var perdida num
# redeploy. Em 03/09/2026 um vídeo ficou preso na fila justamente porque nada
# acionava o worker, e o sintoma foi silêncio — o pior desfecho possível.
#
# A decisão anterior era não agendar até o portão da F0 passar, para não moer
# CPU à toa. Ela foi revista em 03/09/2026: com o acionamento direto no lugar,
# a execução agendada quase sempre encontra fila vazia e sai em segundos, e o
# repositório é público (minuto de Actions gratuito). O custo de moer CPU à
# toa ficou menor que o de perder um vídeo em silêncio.
#
# ## Os segredos que ele precisa
#
#   SUPABASE_SECRET_KEY      — quem escreve na fila é o servidor
#   NEXT_PUBLIC_SUPABASE_URL — o projeto
#
# Sem eles o worker falha na primeira linha, e falhar cedo é o certo: um
# worker que roda sem poder gravar consumiria a fila em silêncio.

name: Render de vídeo

on:
  workflow_dispatch:
    inputs:
      quantos:
        description: "Quantos vídeos processar nesta execução"
        required: false
        default: "3"
  schedule:
    # De hora em hora: rede de segurança para o que o acionamento direto
    # perdeu. Encontrar a fila vazia é o caso NORMAL aqui, não desperdício.
    - cron: "0 * * * *"

concurrency:
  # Nunca dois workers ao mesmo tempo. A trava no banco já impede que dois
  # peguem o MESMO job, mas duas execuções concorrendo por 2 CPUs cada tornam
  # as duas mais lentas que uma.
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # O render é lento por natureza. 30 min cobre um lote de 3 com folga; sem
    # teto explícito, um job travado segura o runner por 6 horas.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar ffmpeg
        # `--no-install-recommends` evita drivers de vídeo que não existem no
        # runner e fazem o apt falhar com 404.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm ci

      - name: Esvaziar a fila
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: npx tsx --conditions=react-server scripts/video/worker.ts "${{ inputs.quantos || '3' }}"
