# Fotos curadas do catálogo: cada JSON em scripts/catalogo/fotos-curadas é
# uma leva conferida (foto do imóvel, sem repetir o que já está na galeria).
#
# Roda aqui porque escrever no Storage exige a chave de serviço, que mora nos
# secrets do repositório. Idempotente: o índice de hash de `midias` recusa
# foto repetida. Só acrescenta; nunca apaga.
#
# Dispara quando uma lista muda na branch de produção (roda só as listas
# alteradas), ou à mão (roda todas).

name: Fotos curadas do catálogo

on:
  push:
    branches: ["claude/modernizar-plataforma-imobiliaria-2tm13q"]
    paths:
      - "scripts/catalogo/fotos-curadas/**"
  workflow_dispatch:

concurrency:
  group: fotos-curadas
  cancel-in-progress: false

jobs:
  trazer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # o `git diff` entre o push anterior e este precisa do histórico
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Trazer as fotos
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          # Só as listas que mudaram neste push (todas, quando à mão).
          if [ "${{ github.event_name }}" = "push" ]; then
            listas=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'scripts/catalogo/fotos-curadas/*.json')
          else
            listas=$(ls scripts/catalogo/fotos-curadas/*.json)
          fi
          for l in $listas; do
            [ -f "$l" ] || continue
            echo "== $l"
            npx tsx --conditions=react-server scripts/catalogo/trazerFotosCuradas.ts "$l"
          done
