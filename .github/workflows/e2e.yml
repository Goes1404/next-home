# E2E em dois jobs: o PAINEL contra o ambiente de testes (sob demanda, por
# enquanto) e o SITE PÚBLICO contra o que está no ar (todo dia).
#
# ## Por que saiu de produção (19/10/2026)
#
# Até aqui este workflow rodava todo dia contra o site de produção, com a
# credencial de um corretor de verdade, e subia o rastro das falhas (telas do
# painel logado) como artefato. Com a plataforma multi-grupo, o banco de
# produção passa a guardar dados de várias empresas, e isso deixou de ser
# aceitável (spec da plataforma, §14 e §18). O E2E agora roda contra o
# ambiente de testes: um projeto Supabase só de teste, montado do zero pelas
# migrations, com dados sintéticos de dois grupos, e um ambiente da Vercel
# apontando para ele. Passo a passo em docs/AMBIENTE-DE-TESTES.md.
#
# `playwright.config.ts` recusa o endereço de produção antes de qualquer
# teste (e2e/baseDoE2E.ts), e test/ambienteDeTestes.test.ts reprova este
# arquivo se ele voltar a apontar para produção ou a subir artefato — com a
# exceção única do job `site-publico`, abaixo.
#
# ## O job `site-publico`: a única porta para produção
#
# Tirar o agendamento inteiro levou junto a única vigilância automática do
# que está no ar (achado M da revisão final da fase 1). Os specs de
# `e2e/publico/` abrem páginas que qualquer visitante abre, sem login, e só
# leem: o motivo da saída (dados de várias empresas no PAINEL) não vale para
# eles. O job roda todo dia com E2E_SO_SITE_PUBLICO=1, que faz a
# configuração montar só os projetos do site público e recusar qualquer
# credencial no ambiente. Sem segredo, sem variável do repositório e sem
# artefato: a guarda reprova qualquer um dos três neste job.
#
# ## Por que o job do painel não está no `schedule`
#
# O projeto Supabase de testes e o ambiente da Vercel ainda não existem
# (dependem do Matheus). Até o E2E passar verde contra eles, o job do painel
# só roda sob demanda (`if: workflow_dispatch`); no agendamento ele rodaria
# contra uma URL vazia. Quando o ambiente existir, ele volta ao agendamento
# junto com a guarda correspondente.
#
# ## Variáveis e segredos (Settings → Secrets and variables → Actions)
#
# - variável E2E_BASE_URL_TESTE: a URL do ambiente `teste` da Vercel;
# - segredos E2E_TESTE_EMAIL e E2E_TESTE_SENHA: o corretor SINTÉTICO criado
#   no banco de teste. Nunca a conta de um corretor de verdade.
#
# Sem a variável, o job para no primeiro passo dizendo o que falta. Sem os
# segredos, os specs do painel são PULADOS com aviso e os do site público
# rodam do mesmo jeito.
#
# ## Sem artefato
#
# O rastro das falhas fica no runner e morre com ele: telas do painel não são
# subidas como artefato, mesmo com o repositório privado. Para investigar uma
# falha, rode o E2E local contra o ambiente de testes (o documento diz como).

name: E2E

on:
  workflow_dispatch:
  schedule:
    # 09:17 UTC = 06:17 em Brasília: antes de a equipe começar o dia. Só o
    # job `site-publico` roda no agendamento.
    - cron: "17 9 * * *"

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  site-publico:
    # Versão fixa: o `ubuntu-latest` passa a ser o Ubuntu 26 em 19/10/2026, e
    # o `playwright install --with-deps` instala pacotes do sistema por versão
    # da distribuição.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar os specs do site público contra o que está no ar
        env:
          E2E_BASE_URL: https://next-home-drab.vercel.app
          E2E_SO_SITE_PUBLICO: "1"
        run: npx playwright test e2e/publico/

  ambiente-de-testes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Conferir o ambiente de testes
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL_TESTE }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "Variável E2E_BASE_URL_TESTE ausente. Crie o ambiente de testes: docs/AMBIENTE-DE-TESTES.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar os specs
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL_TESTE }}
          E2E_CORRETOR_EMAIL: ${{ secrets.E2E_TESTE_EMAIL }}
          E2E_CORRETOR_SENHA: ${{ secrets.E2E_TESTE_SENHA }}
        run: npm run test:e2e
