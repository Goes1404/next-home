<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #060a16;
      }
      #ceu {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, #1f4a96 0%, #12306a 10%, #0a1a3c 24%, #060a16 45%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="29.6" data-width="1080" data-height="1920">
      <div id="ceu" class="clip" data-start="0" data-duration="29.6" data-track-index="0"></div>

      <div id="gancho" data-composition-id="gancho" data-composition-src="compositions/gancho.html"
        data-start="0" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="conversa" data-composition-id="conversa" data-composition-src="compositions/conversa.html"
        data-start="3.4" data-duration="5.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="funil" data-composition-id="funil" data-composition-src="compositions/funil.html"
        data-start="9" data-duration="4.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="foto" data-composition-id="foto" data-composition-src="compositions/foto.html"
        data-start="13.6" data-duration="5.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="lembrete" data-composition-id="lembrete" data-composition-src="compositions/lembrete.html"
        data-start="18.8" data-duration="3.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="fecho" data-composition-id="fecho" data-composition-src="compositions/fecho.html"
        data-start="22.6" data-duration="7" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
